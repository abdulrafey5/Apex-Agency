services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: vector-db
    environment:
      POSTGRES_DB: inception
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: user123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg_data:
